- key: table:slack_channel;slot:help
  summary: "Named Slack channels available as message destinations, with their latest access checks."
  content: |
    Add a registered channel by choosing a workspace, entering a short **Name** and supplying its **Slack channel id**. Invite the app to the channel in Slack, then run **{{label:slack_check_channels}}** on the selected registered channels. Review the retrieved name, membership and archive status before using the channel for delivery. Disable channels you no longer want senders to use.
