- key: process:slack_connect;slot:help
  summary: "Link your account to Slack so you can send messages with your Slack identity."
  content: |
    Use **{{label:slack_connect}}** in **{{label:slack_connection}}** to obtain a Slack authorization link. Open the link and approve the requested access in Slack. Your workspace must already have the app installed. After approval, review your connection and use **{{label:slack_test_message}}** to check it.
- key: process:slack_install;slot:help
  summary: "Install the Slack app for your organization through Slack authorization."
  content: |
    Use **{{label:slack_install}}** in **{{label:slack_connection}}** to obtain the installation link. Open it in Slack and approve access for the intended workspace. Approval creates the workspace record and stores the protected bot credential. You need permission to install the app; individual users then connect their own accounts.
- key: process:slack_test_message;slot:help
  summary: "Queue a test message to your own Slack account using the selected connection."
  content: |
    Select one of your own records in **{{label:slack_connection}}**, then choose **{{label:slack_test_message}}**. Review the selection before continuing. You need permission to send messages. The action queues a test for delivery; check **{{label:slack_message}}** and its attempts if the test does not arrive in Slack.
- key: process:slack_disconnect;slot:help
  summary: "Revoke the selected personal Slack connections."
  content: |
    Select the connections you want to revoke and choose **{{label:slack_disconnect}}**. Review the selected records before continuing. You can disconnect your own account with connection permission; administrators can manage other connections they can access. Use **{{label:slack_connect}}** again if you later need to restore your personal connection.
- key: process:slack_uninstall;slot:help
  summary: "Remove the Slack app installation for the selected workspaces."
  content: |
    As an administrator, select the workspace installations you want to remove and choose **{{label:slack_uninstall}}**. Review the selected records before continuing. This action removes the workspace installation, rather than just disconnecting your own account. Use **{{label:slack_disconnect}}** in **{{label:slack_connection}}** when you only want to revoke a personal connection.
- key: process:slack_check_readiness;slot:help
  summary: "Check workspace setup, permissions and registered Slack destinations."
  content: |
    Select a workspace and choose **{{label:slack_check_readiness}}** to refresh the readiness information. Review the selection before continuing. You need administrator access to run this check. Inspect the resulting status and summary, and review registered channels when access or membership needs attention before relying on message delivery.
- key: process:slack_readiness;slot:help
  summary: "Refresh Slack readiness and add any missing built-in templates."
  content: |
    This scheduled action refreshes deployment and workspace readiness and adds missing built-in templates. Your edits to existing templates are preserved. Review **Workspace readiness** on the Slack home page to see issues that need attention. Administrators can also use **{{label:slack_check_readiness}}** from **{{label:slack_workspace}}** when they need a fresh check.
- key: process:slack_dispatch;slot:help
  summary: "Process Slack messages that are due for delivery and record the results."
  content: |
    This scheduled action picks up messages that are due for delivery and attempts to send them to Slack. Review **{{label:slack_message}}** for the current delivery state and **{{label:slack_message_attempt}}** for individual results and errors. A queued request is not proof of delivery; check its recorded result when investigating a missing message.
- key: table:slack_interaction;slot:help
  summary: "Recorded Slack button interactions, with their processing results."
  content: |
    Review **Interactions** on a message to see who acted and whether the action completed. These records are created automatically when Slack sends button interactions. You do not add or edit this audit history. Button actions run with the clicking user's permissions.
- key: process:slack_check_channels;slot:help
  summary: "Refresh the Slack details and access status of selected registered channels."
  content: |
    Select records in **{{label:slack_channel}}** and choose **{{label:slack_check_channels}}**. As an administrator, review the selection before continuing. The check updates the channel name, privacy, membership, archive status, purpose and check time. Review warnings for channels that need attention and retry later if Slack could not confirm their status.
- key: possibleValueSource:slack_interaction;slot:help
  summary: "Recorded Slack interactions you can reference."
- key: possibleValueSource:slack_interaction_outcome;slot:help
