- key: table:slack_message;field:variablesSnapshot
  summary: "The template values captured when the message was prepared."
- key: table:slack_message;field:idempotencyKey
  summary: "A unique request reference that prevents the same send from being queued twice."
  content: |
    Use this reference to identify repeated requests for the same send. The message queue requires it to be unique, so retrying a request with the same reference does not create another queued message. This prevents duplicate requests; review the delivery status separately to confirm whether Slack received the message.
- key: table:slack_message;field:parentMessageId
  summary: "The earlier message this reply waits for before it can be delivered."
- key: table:slack_message;field:threadTs
  summary: "The Slack identifier of the conversation thread."
- key: table:slack_message;field:targetMessageId
