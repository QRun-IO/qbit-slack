- key: table:slack_template;slot:help
  summary: "Reusable Slack message text and layouts with declared input values."
  content: |
    Review the built-in notification, digest and delivery templates, or add your own. Give each template a unique **Name** that senders can select. Declare the values it accepts in **Variables schema** and use them in **Text** or **Blocks template**. Existing templates are preserved when the built-ins are added again. Do not include personal or health information.
- key: table:slack_template;field:id
  summary: "The unique identifier for this record."
- key: table:slack_template;field:createDate
  summary: "When this record was created."
- key: table:slack_template;field:modifyDate
