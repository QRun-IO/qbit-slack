- key: table:slack_message;section:interactions
  summary: "Button clicks and their processing results for this message."
- key: table:slack_interaction;field:id
  summary: "The unique identifier for this record."
- key: table:slack_interaction;field:createDate
  summary: "When this record was created."
- key: table:slack_interaction;field:modifyDate
  summary: "When this record was last updated."
- key: table:slack_interaction;field:workspaceId
  summary: "The Slack workspace associated with this interaction."
- key: table:slack_interaction;field:messageId
  summary: "The message associated with this interaction."
- key: table:slack_interaction;field:teamId
  summary: "The workspace identifier supplied by Slack."
- key: table:slack_interaction;field:slackUserId
  summary: "The Slack user who performed the action."
- key: table:slack_interaction;field:userId
  summary: "The application account associated with this action."
- key: table:slack_interaction;field:actionName
  summary: "The action requested by the Slack interaction."
- key: table:slack_interaction;field:deliveryKey
  summary: "The unique delivery reference used to recognize repeated Slack requests."
- key: table:slack_interaction;field:error
  summary: "The recorded explanation of a processing failure."
- key: table:slack_interaction;field:outcome
  summary: "The processing result of this interaction."
- key: table:slack_interaction;field:completedDate
  summary: "When processing of this interaction completed."
- key: table:slack_interaction;section:identity
  summary: "The interaction identity, related records and processing result."
- key: table:slack_interaction;section:data
  summary: "Additional action details and processing information."
- key: table:slack_interaction;section:dates
  summary: "When this record was created and last updated."
- key: process:slack_workspace.bulkEdit;slot:help
  summary: "Update editable fields on selected records together."
  content: |
    Select the records you want to change in **{{label:slack_workspace}}**. Choose the editable fields and values, review the proposed changes, then continue. Check the result for records that could not be updated.
- key: process:slack_workspace.bulkEditWithFile;slot:help
  summary: "Update existing records using values from an uploaded file."
  content: |
    Use **{{label:slack_workspace.bulkEditWithFile}}** to upload changes for existing records. Map your file columns to the matching record identifier and editable fields. Review the proposed updates before continuing, then check the result for errors.
- key: process:slack_workspace.bulkDelete;slot:help
  summary: "Delete selected records from the application."
  content: |
    Select the records you intend to remove from **{{label:slack_workspace}}**. Review the selection before continuing and check the result for any records that could not be deleted. To revoke access in Slack, use **{{label:slack_uninstall}}** before deleting the record.
