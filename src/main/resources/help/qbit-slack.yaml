- key: table:slack_template;field:enabled
  summary: "Whether this configuration is available for use."
- key: table:slack_template;field:tenantKey
  summary: "The organization that owns this configuration."
- key: table:slack_template;field:text
  summary: "The message text sent to Slack."
- key: table:slack_template;field:blocksTemplate
  summary: "The reusable Slack message layout, with placeholders for declared values."
- key: table:slack_template;field:variablesSchema
  summary: "The definitions and restrictions for values accepted by this template."
  content: |
    Declare every value your template accepts before using it in the message text or layout. These definitions control which inputs are valid and how they may be used. Keep personal and health information out of template values, and supply links as URLs rather than arbitrary text.
