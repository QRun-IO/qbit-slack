bundle: qbit-slack
version: 1
layer: QBIT
# Help for the Slack app and every slack_* table, in the QQQ help-bundle format
# (qqq#1198). Each table entry says what the table is for and how its rows get
# created, so an empty table explains itself. SlackHelp applies it until the core
# HelpBundles registry ships in a QQQ release.
# Summaries stay under 120 characters (SlackTablesGuardrailTest).
entries:
  - key: app:slack;slot:help
    summary: "Send Slack messages from QQQ through a durable outbox, as the person who sent them."
    content: |
      Set up in this order: 1) Install the Slack app for your organization (Connections, "Install for my organization") so a Workspace row exists; 2) each person uses "Connect Slack" so messages go out as them; 3) register the channels and user groups your processes post to, then run "Check channels"; 4) review the built-in Templates. Every send is queued in Messages and retried; Attempts and Interactions are the audit trail. The Readiness section on the home shows what still needs attention.

  - key: table:slack_workspace;slot:help
    summary: "A Slack workspace this system is installed in, with its bot token status and readiness."
    content: |
      **How rows get created:** an administrator runs "Install for my organization" (Connections) and approves the app in Slack; the OAuth callback creates the row and stores the bot token encrypted. Nothing is typed in by hand. Use "Check readiness" to re-check the bot token, scopes and registered channels, and "Uninstall" to remove the app.

  - key: table:slack_connection;slot:help
    summary: "A person's own link to a workspace, so their Slack messages are sent as them."
    content: |
      **How rows get created:** each user runs "Connect Slack" and approves access in Slack; the OAuth callback creates the row and stores their token encrypted. An administrator can see everyone's. "Send me a test message" checks it works, and "Disconnect" revokes it. A workspace must be installed first.

  - key: table:slack_channel;slot:help
    summary: "A Slack channel registered under a short name, so processes can post to it and see its status."
    content: |
      **How rows get created:** an administrator adds one with New: pick the workspace, give it a short name that senders use, and paste the Slack channel ID (open the channel in Slack, then About, then the ID at the bottom). Invite the bot with /invite @YourApp, then run "Check channels": it fills in the Slack name, private, bot is member, archived, purpose and checked time. Readiness re-checks enabled channels on a schedule, and messages are sent only to enabled channels the bot can post to.

  - key: table:slack_user_group;slot:help
    summary: "A Slack user group registered under a short name, mentioned when a message goes to the group."
    content: |
      **How rows get created:** an administrator adds one with New: pick the workspace, give it a short name, paste the Slack user group ID (starts with S) and the ID of the channel where the group is mentioned. The handle is filled in by Check readiness when the app has the optional usergroups:read scope, and then shows in the mention as @handle. A group without a user group ID or channel cannot be sent to.

  - key: table:slack_template;slot:help
    summary: "Message templates (text and Slack blocks) with declared variables, used by name when sending."
    content: |
      **How rows get created:** the qbit adds three built-ins at startup and on each readiness run: notification, digest and delivery (never overwritten once you edit them). Administrators add their own with New: variables must be declared, links must be URLs, and nothing classified as PHI or PII is allowed. A sender names the template and passes variables.

  - key: table:slack_message;slot:help
    summary: "The outbox: every Slack message queued, sent, retried or dead-lettered, with who sent it."
    content: |
      **How rows get created:** automatically. Anything that sends to Slack (a process, an alert, a delivery destination, a test message) queues a row here first as its owner; the dispatcher then posts it and records the outcome. It starts empty on a new installation and is read-only history; nothing is typed in by hand.

  - key: table:slack_message_attempt;slot:help
    summary: "One row per delivery attempt of a message: outcome, Slack error and timing."
    content: |
      **How rows get created:** automatically, by the dispatcher, each time it tries to post a message. Use it to see why a message is retrying or failed. It is audit history and is never edited.

  - key: table:slack_interaction;slot:help
    summary: "Audit of clicks on message buttons and Slack events, and what each one did."
    content: |
      **How rows get created:** automatically, when someone clicks a button on a Slack message or Slack sends a revocation event to the callback URL. Each row records who acted, the action and the outcome (the action runs as the clicking user). It is audit history and is never edited.
