- key: table:slack_message;field:fileReconcileRequired
  summary: "Whether an uncertain file upload needs reconciliation before another attempt."
  content: |
    A file request may reach Slack even when its response is lost. This flag indicates that the sender must check what happened before trying the upload again. Review the file identifier and attempt history when investigating the message, so an uncertain result is not mistaken for a confirmed failure.
- key: table:slack_message;field:slackTs
