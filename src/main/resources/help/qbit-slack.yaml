bundle: qbit-slack
version: 0.1.0-SNAPSHOT
layer: QBIT
entries:
- key: app:slack;slot:help
  summary: "Connect your Slack account, manage message destinations and review delivery results."
  content: |
    Start with **{{label:slack_install}}** in **{{label:slack_connection}}**, then use **{{label:slack_connect}}** to link your own account. Register the channels and user groups you need, and review **{{label:slack_template}}** before sending.

    Use **{{label:slack_message}}** to follow delivery progress and **{{label:slack_message_attempt}}** to investigate failures. Your home page shows your connections and recent deliveries. Administrators can also review workspace readiness, queued messages and recent failures.
- key: table:slack_workspace;slot:help
  summary: "Slack workspaces installed for your organization, with connection health and readiness."
  content: |
    Use **{{label:slack_install}}** from **{{label:slack_connection}}** to create a workspace by approving access in Slack. You do not create workspace records by hand. Review **{{label:slack_check_readiness}}** results to identify missing access or channel setup. Administrators can use **{{label:slack_uninstall}}** to remove the installation.
