- key: table:slack_message_attempt;slot:help
  summary: "Individual attempts to deliver a Slack message, with outcomes, errors and timing."
  content: |
    Use these records to investigate a message that is waiting to retry or has failed. Each delivery attempt records its outcome, timing and any error returned. Follow **Message id** to the related message for its destination and overall status. Attempt records are created automatically and cannot be edited.
