- key: table:slack_message;slot:help
  summary: "Queued Slack messages and their delivery history, including retries and failures."
  content: |
    Open a message to review its destination, sending identity and delivery status. Messages are created automatically when a process, alert, delivery or test requests a send. You do not add or edit this history by hand. Review **{{label:slack_message_attempt}}** for delivery errors.
