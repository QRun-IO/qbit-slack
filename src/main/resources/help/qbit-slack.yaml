- key: table:slack_user_group;slot:help
  summary: "Named Slack user groups that messages can mention in a specified channel."
  content: |
    Add a group by choosing a workspace and entering a short **Name**, the **Slack usergroup id** and the destination **Channel id**. Messages to the group mention it in that channel. **{{label:slack_check_readiness}}** can retrieve the group handle when the installation has permission to read user groups.
