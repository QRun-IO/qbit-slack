- key: table:slack_connection;slot:help
  summary: "Links between your account and Slack, used to send messages with your Slack identity."
  content: |
    Use **{{label:slack_connect}}** and approve access in Slack to create your connection. Your organization must install the app first. Select your connection and use **{{label:slack_test_message}}** to check delivery. Use **{{label:slack_disconnect}}** when you want to revoke the link. Administrators can review connections for other users.
